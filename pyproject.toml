[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catanlab"
version = "0.1.0"
description = "Simulation and strategy analysis toolkit for Catan."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "torch>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
]

[tool.setuptools.packages.find]
where = ["src"]
